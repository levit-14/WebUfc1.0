<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Galería - Sean O'Malley UFC</title>
    <style>
        body {
            background-color: #ffffff;
            color: #111111;
            margin: 0;
            font-family: Arial, sans-serif;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #ffffff;
            border-bottom: 3px solid #d20a0a;
            padding: 10px 20px;
        }
        .barra-navegacion {
            display: flex;
            gap: 15px;
            margin-top: 10px;
        }
        .boton {
            text-decoration: none;
            color: #111111;
            background-color: #e0e0e0;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.3s;
        }
        .boton:hover {
            background-color: #d20a0a;
            color: #ffffff;
        }
        .boton-activo {
            background-color: #d20a0a;
            color: #ffffff;
            font-weight: bold;
            text-decoration: none;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 14px;
        }
        .logo-cabecera {
            max-width: 180px;
            height: auto;
            display: block;
        }

        main {
            display: flex;
            gap: 20px;
            margin: 20px;
        }
        
        aside {
            width: 28%;
            background-color: #f2f2f2;
            border: 1px solid #e0e0e0;
            padding: 15px;
            box-sizing: border-box;
            text-align: center;
        }
        .ad-slogan {
            color: #d20a0a;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 5px;
        }
        .ad-brand {
            font-family: 'Georgia', serif;
            font-style: italic;
            font-size: 26px;
            color: #000000;
            margin-top: 0;
            margin-bottom: 15px;
        }
        .ad-container-img {
            width: 100%;
            background-color: #ffffff;
            padding: 10px;
            border-radius: 6px;
            box-sizing: border-box;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .ad-img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 4px;
        }

        section {
            width: 72%;
            background-color: #ffffff;
            border: 1px solid #e0e0e0;
            padding: 25px;
            box-sizing: border-box;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .galeria-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        .foto-galeria {
            width: 100%;
            max-height: 350px;
            object-fit: cover;
            border-radius: 6px;
            border: 2px solid #d20a0a;
        }

        h1, h2, h3 { 
            text-transform: uppercase;
            font-family: 'Impact', 'Franklin Gothic Medium', sans-serif;
            letter-spacing: 1px;
        }
        h1 { color: #111111; }
        h2 { color: #d20a0a; }
        p {
            color: #333333;
            line-height: 1.6;
            font-size: 15px;
        }
        
        footer {
            background-color: #111111;
            color: #ffffff;
            border-top: 3px solid #d20a0a;
            text-align: center;
            padding: 12px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <header>
        <div>
            <h1 style="margin: 0;">UFC <span style="color: #d20a0a;">EDITION</span></h1>
            <nav class="barra-navegacion">
                <a href="index.html" class="boton">Inicio</a>
                <a href="index2.html" class="boton">Carrera</a>
                <a href="index3.html" class="boton-activo">Contacto</a>
            </nav>
        </div>
        <img src="imagen/ufc.png" alt="Logo UFC" class="logo-cabecera">
    </header>

    <main>
        <aside>
            <div class="ad-slogan">Siente la Fuerza</div>
            <div class="ad-brand">Venum Fightwear</div>
            <div class="ad-container-img">
                <img src="imagen/venum_ad.jpg" alt="Publicidad Venum UFC" class="ad-img">
            </div>
        </aside>

        <section>
            <article>
                <h2>Galería de Imagenes</h2>
                <div class="galeria-container">
                    <!-- Espacio para la foto final -->
                    <img src="imagen/omalley_estilo.jpg" alt="Sean O'Malley Galería" class="foto-galeria">
                </div>
                <p>Para más información o consultas sobre eventos futuros, puedes seguir las actualizaciones oficiales de la UFC y sus principales patrocinadores deportivos.</p>
            </article>
        </section>
    </main>

    <footer>
        <p>Pie de página - Página Final UFC Edition</p>
    </footer>
</body>
</html>
